<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f5" />
    <meta name="description" content="A little wardrobe for Microduck. Curated 3D looks, playful mix-and-match, and URDF + MJCF exports." />
    <title>DuckRobe · A little duck wardrobe</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="%BASE_URL%" aria-label="DuckRobe home"><span class="brand-icon"><img src="%BASE_URL%brand/logo-mark.svg" alt="" width="31" height="31" /></span><span>duck<span class="brand-light">robe</span></span></a>
        <nav class="main-nav" aria-label="Main navigation" data-i18n-aria="mainNavigation"><button class="nav-button active" id="wardrobe-nav"><span data-i18n="navWardrobe">Wardrobe</span></button><button class="nav-button" id="saved-nav"><span data-i18n="navSaved">Saved looks</span> <span id="saved-count">0</span></button></nav>
        <details class="app-more" id="app-more"><summary data-i18n="more">More</summary><div class="app-more-content"><button id="share-look" data-i18n="shareLook">Copy look link</button><button class="export-button" id="export-look"><span data-icon="download"></span><span><span data-i18n="exportLook">Export model</span><small>URDF + MJCF</small></span><span data-icon="arrow-up-right"></span></button><div class="language-switch" aria-label="Language" data-i18n-aria="languageChoice"><button class="active" data-language="en" aria-pressed="true">EN</button><button data-language="zh" aria-pressed="false">中文</button></div><button id="about-button" data-i18n="about">About DuckRobe</button><button id="source-button" data-i18n="modelSources">Model &amp; open source</button><a class="repository-link" id="repository-link" href="https://github.com/ruziniuuuuu/DuckRobe" target="_blank" rel="noopener noreferrer" aria-label="Open DuckRobe on GitHub in a new tab" title="Open DuckRobe on GitHub in a new tab" data-i18n-aria="githubRepository" data-i18n-title="githubRepository"><span data-i18n="githubLabel">GitHub</span><span data-icon="arrow-up-right"></span></a></div></details>
      </header>
      <main>
        <div class="wardrobe-layout">
          <section class="fitting-room" aria-label="3D fitting room" data-i18n-aria="fittingRoom">
            <div class="stage-heading"><details class="wearing-panel" id="wearing-panel"><summary><span id="look-name"></span><span aria-hidden="true">⌄</span></summary><div class="wearing-content"><div class="mix-heading"><span data-i18n="wearingNow">Wearing now</span><button id="clear-look" data-i18n="clearLook">Take it all off</button></div><div class="equipped-items" id="equipped-items"></div></div></details><div class="camera-tools"><button id="frame-camera" class="frame-button" aria-pressed="false" data-i18n="closeUp">Close up</button><button class="icon-button" id="reset-camera" aria-label="Reset view" data-i18n-aria="resetView" data-i18n-title="resetView"><span data-icon="rotate-ccw"></span></button></div></div>
            <div class="viewer" id="viewer"><div class="pet-reaction" id="pet-reaction" aria-live="polite" hidden>♡</div><div class="viewer-loading" id="viewer-loading"><span class="loading-duck">⌁</span><strong data-i18n="loadingTitle">Your little duck is getting ready…</strong><span data-i18n="loadingDescription">One moment for a little personality.</span></div><div class="stage-hint"><span data-icon="move"></span><span data-i18n="stageHint">Drag to turn · Scroll to get closer</span></div></div>
            <div class="studio-tools"><button id="undo-look" class="tool-button" disabled><span data-icon="rotate-ccw"></span><span data-i18n="undo">Undo</span></button>
              <details class="studio-panel" id="colors-panel"><summary><span data-icon="layers"></span><span data-i18n="colorTool">Colors</span><span class="panel-plus">+</span></summary><div class="studio-panel-content">            <div class="palette-panel"><div class="palette-heading"><span data-i18n="duckColors">A color of their own</span><div class="palette-actions"><button id="color-lock" class="color-lock" aria-pressed="false"><span data-i18n="colorLock">Lock colors</span></button><button id="apply-look-colors"><span data-i18n="lookPalette">Look colors</span></button><button id="reset-colors" data-i18n="resetColors">Reset</button></div></div><div class="palette-controls"><div class="palette-presets" id="palette-presets" aria-label="Duck color palettes" data-i18n-aria="colorPalettes"></div><div class="color-fields"><label class="color-field"><input type="color" id="shell-color" value="#eea349" aria-label="Shell color" data-i18n-aria="shellColor" /><span data-i18n="shellColor">Shell</span></label><label class="color-field"><input type="color" id="accent-color" value="#f4ece0" aria-label="Accent color" data-i18n-aria="accentColor" /><span data-i18n="accentColor">Accents</span></label></div></div><p class="color-status" id="color-status" aria-live="polite">A palette to match this look.</p></div>
</div></details>
              <details class="studio-panel" id="moves-panel"><summary><span data-icon="sparkles"></span><span data-i18n="motionTool">Moves</span><span class="panel-plus">+</span></summary><div class="studio-panel-content">            <div class="pet-controls">
              <div class="stage-tools"><div class="motion-control"><button class="motion-button active" id="motion-toggle" aria-pressed="true"><span data-icon="sparkles"></span><span id="motion-label">Ready to play</span><span class="toggle-track"><i></i></span></button></div></div>
              <div class="pet-action-row"><div class="pet-action-menu" id="pet-action-menu" aria-label="Play with your duck" data-i18n-aria="playWithDuck"><button data-action="hop"><span>↟</span><span data-i18n="actionHop">Hop</span></button><button data-action="dance"><span>♫</span><span data-i18n="actionDance">Happy dance</span></button><button data-action="turn"><span>⤾</span><span data-i18n="actionTurn">Little twirl</span></button></div><details class="more-actions"><summary><span data-i18n="moreActions">More moves</span><span aria-hidden="true">⌄</span></summary><div class="extra-action-menu" id="extra-action-menu" aria-label="More ways to play" data-i18n-aria="extraMoves"></div></details></div>
            </div>
</div></details>
              <button class="playground-launch" id="open-playground" disabled><span data-icon="move"></span><span data-i18n="playgroundTry">Play</span></button>
            </div>
          </section>
          <section class="closet" aria-label="Clothing wardrobe" data-i18n-aria="clothingWardrobe">
            <div class="closet-controls">
            <div class="closet-title"><h1 id="closet-title" data-i18n="closetTitle">Wardrobe</h1><span class="item-count" id="result-count"></span></div>
            <div class="catalog-slots"><div class="slot-controls" id="slot-controls" aria-label="Choose a wardrobe category" data-i18n-aria="chooseCategory"><button class="slot-button active" data-slot="all"><span data-icon="layers"></span><span data-i18n="slotAll">All looks</span></button><button class="slot-button" data-slot="hat"><span data-icon="hat"></span><span data-i18n="slotHat">Hats</span></button><button class="slot-button" data-slot="eyewear"><span data-icon="glasses"></span><span data-i18n="slotEyewear">Eyewear</span></button><button class="slot-button" data-slot="body"><span data-icon="shirt"></span><span data-i18n="slotBody">Clothes</span></button><button class="slot-button" data-slot="accessory"><span data-icon="sparkles"></span><span data-i18n="slotAccessory">Accessories</span></button><button class="slot-button" data-slot="legwear"><span data-icon="layers"></span><span data-i18n="slotLegwear">Legwear</span></button></div></div>
            <div class="search-row"><label class="search-box"><span data-icon="search"></span><input id="outfit-search" placeholder="Find a little inspiration…" aria-label="Search the wardrobe" data-i18n-aria="searchWardrobe" data-i18n-placeholder="searchPlaceholder" /><kbd>/</kbd></label><details id="collection-filter" class="collection-filter"><summary data-i18n="filters">Filter</summary><div class="filter-content"><button class="filter-favorites icon-button" id="filter-favorites" aria-label="Show favorites" aria-pressed="false" title="Show favorites" data-i18n-aria="showFavorites" data-i18n-title="showFavorites"><span data-icon="heart"></span><span data-i18n="showFavorites">Show favorites</span></button><div class="theme-filters" id="theme-filters" aria-label="Filter by collection" data-i18n-aria="filterCollection"></div></div></details><button id="random-button" class="random-button" data-i18n-title="surpriseMe" aria-label="Surprise me" data-i18n-aria="surpriseMe"><span data-icon="shuffle"></span></button></div>
            <div class="accessory-filters" id="accessory-filters" aria-label="Choose where to wear an accessory" data-i18n-aria="accessoryRegions" hidden></div>

            </div>
            <div class="catalog-scroll" id="catalog-scroll" tabindex="0" role="region" aria-label="Browse wardrobe looks and pieces" data-i18n-aria="scrollWardrobe">
            <div class="outfit-grid" id="outfit-grid" aria-live="polite"></div>
            </div>
            <div class="closet-bottom"><span id="draft-status" role="status" data-i18n="draftSaved">Changes kept on this device</span><button class="save-button" id="save-look" disabled><span data-icon="bookmark"></span><span data-i18n="saveLook">Save look</span></button></div>
          </section>
        </div>
      </main>

    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-message"></span><button id="toast-undo" data-i18n="undo" hidden>Undo</button></div>
    <dialog id="info-dialog"><button class="dialog-close icon-button" id="dialog-close" aria-label="Close" data-i18n-aria="close"><span data-icon="x"></span></button><div id="dialog-content"></div></dialog>
    <dialog id="playground-dialog" aria-label="Playground" data-i18n-aria="playgroundTitle"><div id="playground-host"></div></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
